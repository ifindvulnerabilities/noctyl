<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 128 128">
  <!-- Noctyl tab icon (from assets/Logo.png): the white moon on dark browser tab bars, a near-black one on light tab bars -->
  <style>.on-light { display: none; } @media (prefers-color-scheme: light) { .on-dark { display: none; } .on-light { display: inline; } }</style>
  <image class="on-dark" width="128" height="128" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
  <image class="on-light" width="128" height="128" href="data:image/png;base64," xlink:href="data:image/png;base64,"/>
</svg>